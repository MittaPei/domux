<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Clarify, Bind, Commit — Domux safety integration evidence</title>
  <desc id="desc">A five-step fail-closed execution pipeline with formal v1, post-formal diagnostics, provenance-bound Home Assistant schema 4, and v5 correction results.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: "DejaVu Sans"; }
      .small { font-size: 18px; fill: #475569; }
      .body { font-size: 20px; fill: #334155; }
      .metric { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1.2px; }
      .panel-title { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .pipeline-title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect width="1600" height="124" fill="url(#header)"/>
  <text x="60" y="66" class="sans" font-size="48" font-weight="800" fill="#ffffff">Clarify, Bind, Commit</text>
  <text x="60" y="101" class="sans" font-size="22" fill="#dbeafe">Domux parses intent; a deterministic boundary owns authorization and Home Assistant execution.</text>
  <rect x="1320" y="34" width="220" height="54" rx="27" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="1430" y="68" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#1e3a8a">HER Hack-Astron #4</text>

  <text x="60" y="164" class="sans label" fill="#1d4ed8">FAIL-CLOSED CONTROL PATH</text>

  <g filter="url(#shadow)">
    <rect x="60" y="188" width="260" height="190" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="60" y="188" width="260" height="9" rx="4" fill="#2563eb"/>
    <circle cx="96" cy="230" r="20" fill="#dbeafe"/>
    <text x="96" y="237" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#1d4ed8">1</text>
    <text x="126" y="238" class="sans pipeline-title">Model as parser</text>
    <text x="82" y="278" class="sans body">Pinned HF snapshot</text>
    <text x="82" y="309" class="sans body">7-slot raw output</text>
    <text x="82" y="344" class="sans small">96 probes, one formal run</text>
  </g>
  <path d="M324 282 H347" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M342 272 L354 282 L342 292" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="365" y="188" width="260" height="190" rx="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="365" y="188" width="260" height="9" rx="4" fill="#4f46e5"/>
    <circle cx="401" cy="230" r="20" fill="#e0e7ff"/>
    <text x="401" y="237" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#4338ca">2</text>
    <text x="431" y="238" class="sans pipeline-title">Registry ground</text>
    <text x="387" y="278" class="sans body">User words + inventory</text>
    <text x="387" y="309" class="sans body">Stable entity candidates</text>
    <text x="387" y="344" class="sans small">Model IDs are never trusted</text>
  </g>
  <path d="M629 282 H652" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M647 272 L659 282 L647 292" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="670" y="188" width="260" height="190" rx="22" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="670" y="188" width="260" height="9" rx="4" fill="#0d9488"/>
    <circle cx="706" cy="230" r="20" fill="#ccfbf1"/>
    <text x="706" y="237" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#0f766e">3</text>
    <text x="736" y="238" class="sans pipeline-title">Clarify</text>
    <text x="692" y="278" class="sans body">At most 3 stable choices</text>
    <text x="692" y="309" class="sans body">Explicit target repair</text>
    <text x="692" y="344" class="sans small">Excluded targets stay blocked</text>
  </g>
  <path d="M934 282 H957" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M952 272 L964 282 L952 292" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="975" y="188" width="260" height="190" rx="22" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <rect x="975" y="188" width="260" height="9" rx="4" fill="#d97706"/>
    <circle cx="1011" cy="230" r="20" fill="#fef3c7"/>
    <text x="1011" y="237" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#b45309">4</text>
    <text x="1041" y="238" class="sans pipeline-title">Prepare</text>
    <text x="997" y="278" class="sans body">Bind plan + session</text>
    <text x="997" y="309" class="sans body">State + capability + TTL</text>
    <text x="997" y="344" class="sans small">No pre-confirm service call</text>
  </g>
  <path d="M1239 282 H1262" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M1257 272 L1269 282 L1257 292" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1280" y="188" width="260" height="190" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="1280" y="188" width="260" height="9" rx="4" fill="#16a34a"/>
    <circle cx="1316" cy="230" r="20" fill="#dcfce7"/>
    <text x="1316" y="237" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#15803d">5</text>
    <text x="1346" y="238" class="sans pipeline-title">Commit once</text>
    <text x="1302" y="278" class="sans body">HA call + postcondition</text>
    <text x="1302" y="309" class="sans body">Nonce consumed once</text>
    <text x="1302" y="337" class="sans" font-size="16" fill="#475569">0 SUT dispatches after</text>
    <text x="1302" y="360" class="sans" font-size="16" fill="#475569">replay / target drift</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="428" width="460" height="390" rx="24" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="88" y="467" class="sans label" fill="#b91c1c">SOLE FORMAL RESULT</text>
    <text x="88" y="507" class="sans panel-title">v1 · frozen before inference</text>
    <text x="88" y="546" class="sans body">48 paired bases · 96 probes · 0 reruns</text>
    <line x1="88" y1="565" x2="492" y2="565" stroke="#e2e8f0" stroke-width="2"/>
    <text x="88" y="606" class="sans metric">48/48</text>
    <text x="205" y="606" class="sans body">clear-command specificity</text>
    <text x="88" y="646" class="sans metric">47/48</text>
    <text x="205" y="646" class="sans body">paired discrimination</text>
    <text x="88" y="686" class="sans metric">42/48</text>
    <text x="205" y="686" class="sans body">B2 guarded exact delta</text>
    <text x="88" y="726" class="sans metric">1/48</text>
    <text x="205" y="726" class="sans body">B0 unique-or-abstain dispatch</text>
    <text x="88" y="764" class="sans small">Median 638.807 ms · p95 922.706 ms</text>
    <rect x="367" y="775" width="125" height="32" rx="16" fill="#fee2e2"/>
    <text x="429" y="797" text-anchor="middle" class="sans" font-size="17" font-weight="800" fill="#b91c1c">GATE: FAIL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="570" y="428" width="460" height="390" rx="24" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="598" y="467" class="sans label" fill="#b45309">DIAGNOSTIC, POST-FORMAL</text>
    <text x="598" y="507" class="sans panel-title">D0 first-match + v2 repair</text>
    <text x="598" y="546" class="sans body">Frozen v1 outputs · no model rerun</text>
    <line x1="598" y1="565" x2="1002" y2="565" stroke="#e2e8f0" stroke-width="2"/>
    <text x="598" y="602" class="sans metric">32/48</text>
    <text x="715" y="602" class="sans body">D0 bases with any call</text>
    <text x="598" y="638" class="sans metric">16/48</text>
    <text x="715" y="638" class="sans body">D0 exact target delta</text>
    <text x="598" y="674" class="sans metric">13/48</text>
    <text x="715" y="674" class="sans body">D0 wrong-target transitions</text>
    <text x="598" y="710" class="sans metric">3/48</text>
    <text x="715" y="710" class="sans body">D0 multi-call bases</text>
    <text x="598" y="746" class="sans metric">47/48</text>
    <text x="715" y="746" class="sans body">v2 B2 guarded exact delta</text>
    <text x="598" y="782" class="sans" font-size="16" fill="#475569">D0 is not formal B0 · v2 gate still fails</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="428" width="460" height="390" rx="24" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1108" y="467" class="sans label" fill="#15803d">PROVENANCE-BOUND ACCEPTANCE</text>
    <text x="1108" y="507" class="sans panel-title">Real HA · schema 4 + v5</text>
    <text x="1108" y="546" class="sans body">4 v1 pairs + 4 frozen scenario rows</text>
    <line x1="1108" y1="565" x2="1512" y2="565" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1108" y="602" class="sans metric">3/3</text>
    <text x="1204" y="602" class="sans body">exact HA transitions</text>
    <text x="1108" y="638" class="sans metric">1/1</text>
    <text x="1204" y="638" class="sans body">state-drift rejection</text>
    <text x="1108" y="674" class="sans metric">0</text>
    <text x="1204" y="674" class="sans small">extra SUT calls after replay/drift</text>
    <text x="1108" y="710" class="sans metric">9</text>
    <text x="1204" y="710" class="sans body">5 setup + 3 SUT + 1 fault</text>
    <text x="1108" y="746" class="sans metric">2×</text>
    <text x="1204" y="746" class="sans small">recorded HA runs · same artifact SHA</text>
    <text x="1108" y="782" class="sans" font-size="16" fill="#475569">4 runtime bindings · pre/post stable · mapped subset</text>
  </g>

  <rect x="60" y="858" width="1480" height="92" rx="22" fill="#e2e8f0"/>
  <text x="86" y="892" class="sans" font-size="19" font-weight="800" fill="#0f172a">PINNED RUN</text>
  <text x="226" y="892" class="sans small">HF revision 6c71a32f… · full BF16 snapshot 10.28 GB · A800 80 GB · 2 independent warm-ups excluded</text>
  <text x="86" y="928" class="sans" font-size="19" font-weight="800" fill="#991b1b">BOUNDARY</text>
  <text x="226" y="928" class="sans small">v1 is sole formal. D0/v2 are post-formal; HA is not a live model-to-HA run. No production-safety claim.</text>
</svg>
